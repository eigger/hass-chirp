version: 2
updates:
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: daily
  cooldown:
    exclude:
    - eigger/hass-repo-standards
    - eigger/hass-repo-standards/*
  groups:
    central-standards:
      patterns:
      - eigger/hass-repo-standards
      - eigger/hass-repo-standards/*
- package-ecosystem: pip
  directory: /
  # The support floor must match hacs.json and the minimum CI expected version.
  # Update this exact HA/plugin pair only in an explicit support-floor PR.
  exclude-paths:
  - requirements_test_min.txt
  schedule:
    interval: weekly
  groups:
    home-assistant-tests:
      patterns:
      - homeassistant
      - pytest-homeassistant-custom-component
      - aiohttp
    security:
      applies-to: security-updates
      patterns:
      - "*"

